version: '3.8'

services:
  myplants:
    image: myplants
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myplants
    ports:
      - "8020:8020"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
      # 启用 R2 时取消注释(值放同目录 .env 文件,勿提交仓库):
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=${R2_BUCKET}
      - R2_PUBLIC_BASE=${R2_PUBLIC_BASE}
    restart: unless-stopped
    networks:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8020/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app:
    external: true

