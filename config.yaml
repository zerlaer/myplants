# 我的花园 - My Plants 配置文件
server:
  port: 8020
  mode: release  # debug / release

database:
  driver: sqlite
  path: ./data/myplants.db

logger:
  level: info       # debug / info / warn / error
  encoding: console # console / json
  path: ./logs
  filename: myplants.log

upload:
  path: ./uploads
  max_size: 10485760  # 10MB

# 图片存储驱动: local=本地磁盘 / r2=Cloudflare R2
# 凭证推荐用环境变量注入(R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_BUCKET / R2_PUBLIC_BASE / STORAGE_DRIVER),
# 环境变量优先级高于本文件,不要把密钥提交进仓库
storage:
  driver: r2
  r2:
    account_id: ""
    access_key_id: ""
    secret_access_key: ""
    bucket: ""
    public_base: ""   # 公开桶域名,如 https://pub-xxxx.r2.dev 或自定义域

reminder:
  # 默认浇水间隔(天)
  default_water_days: 4
  # 默认施肥间隔(天)
  default_fertilize_days: 15
  # 默认打药间隔(天)
  default_spray_days: 30
